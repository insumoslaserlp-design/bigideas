@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#231a1c; --paper-2:#2c2124; --card:#33262a; --ink:#f7e6e3; --ink-soft:#c3a8ac;
  --rose:#e3a3a8; --rose-deep:#f0b8bd; --butter:#e8c06a; --mint:#7cc3b2; --line:#4a3a3e;
  --ok:#7bcfa9; --warn:#efaa60; --bad:#f08a96; --on-rose:#2a1b1e; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#231a1c; --paper-2:#2c2124; --card:#33262a; --ink:#f7e6e3; --ink-soft:#c3a8ac;
  --rose:#e3a3a8; --rose-deep:#f0b8bd; --butter:#e8c06a; --mint:#7cc3b2; --line:#4a3a3e;
  --ok:#7bcfa9; --warn:#efaa60; --bad:#f08a96; --on-rose:#2a1b1e; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}

/* header */
.top{display:flex;align-items:center;gap:14px;padding-block:18px 6px;flex-wrap:wrap}
.logo{width:68px;height:68px;border-radius:50%;background:var(--logo) center/112% no-repeat;box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--line);flex:none}
.brand{min-width:0;flex:1}
.brand h1{font-size:clamp(1.4rem,3.6vw,1.9rem);color:var(--rose-deep)}
.brand .hand{font-family:var(--f-hand);font-size:1.35rem;color:var(--ink-soft);line-height:1}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.92rem;text-decoration:none;color:var(--ink)}
.pill:hover{border-color:var(--rose)}
.pill .count{background:var(--rose-deep);color:var(--on-rose);border-radius:999px;min-width:22px;padding:0 6px;font-size:.8rem;text-align:center}
.pill.admin{border-style:dashed}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* promo ribbon */
.promos{display:grid;gap:8px;margin-top:12px}
.promo{display:flex;align-items:center;gap:12px;background:var(--butter);color:#4a3415;border-radius:var(--r-md);padding:10px 16px;font-weight:700;flex-wrap:wrap}
.promo .tag{font-family:var(--f-hand);font-size:1.5rem;line-height:1}
.promo small{font-weight:600;opacity:.8}

/* hero */
.hero{margin-top:18px;border-radius:var(--r-lg);padding:26px clamp(18px,4vw,36px);position:relative;overflow:hidden;
  background:repeating-linear-gradient(0deg,transparent 0 7px,color-mix(in srgb,var(--rose) 13%,transparent) 7px 8px),var(--paper-2)}
.hero h2{font-size:clamp(1.6rem,4.4vw,2.5rem);max-width:26ch}
.hero p{max-width:60ch;margin:10px 0 0;color:var(--ink-soft);font-size:1.05rem}
.hero .note{font-family:var(--f-hand);font-size:1.4rem;color:var(--rose-deep);margin-top:8px}

/* filters */
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 14px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-weight:700;font-size:.9rem;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--rose-deep);border-color:var(--rose-deep);color:var(--on-rose)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:18px}
.card{background:var(--card);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;border:1.5px solid var(--line);transition:transform .2s ease,box-shadow .2s ease;text-align:left;padding:0}
.card:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 10px 24px -14px color-mix(in srgb,var(--rose-deep) 60%,transparent)}
.thumb{aspect-ratio:1/1;width:100%;max-width:100%;position:relative;background:var(--paper-2);display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;
  background:repeating-linear-gradient(0deg,transparent 0 9px,color-mix(in srgb,var(--rose) 18%,transparent) 9px 11px),var(--paper-2)}
.ph svg{width:38%;height:38%;stroke:var(--rose);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.badges{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.badge{font-size:.75rem;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--card);color:var(--ink);letter-spacing:.02em}
.badge.sale{background:var(--bad);color:#fff}
.badge.new{background:var(--mint);color:#173b33}
.badge.sample{background:var(--ink);color:var(--paper)}
.badge.vid{margin-left:auto}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-body h3{font-size:1.15rem}
.cat{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.price{font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
.price s{font-weight:600;font-size:.9rem;color:var(--ink-soft);margin-right:6px}
.price.on-sale b{color:var(--bad)}
.stock{font-size:.82rem;font-weight:700}
.stock.ok{color:var(--ok)} .stock.low{color:var(--warn)} .stock.out{color:var(--bad)} .stock.mto{color:var(--ink-soft)}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--ink-soft)}
.empty .hand{font-family:var(--f-hand);font-size:1.6rem;color:var(--rose-deep)}

footer{margin-top:40px;text-align:center;color:var(--ink-soft);font-size:.9rem;display:grid;gap:4px}
footer .hand{font-family:var(--f-hand);font-size:1.4rem;color:var(--rose-deep)}

/* overlays */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#2a1418 45%,transparent);z-index:40;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);border-radius:var(--r-lg);width:min(920px,100%);position:relative;overflow:hidden}
.x{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:720px){.detail{grid-template-columns:1fr}}
.gallery{background:var(--paper-2);display:flex;flex-direction:column}
.stage{aspect-ratio:1/1;width:100%;max-width:100%;display:grid;place-items:center;background:var(--paper-2)}
.stage img,.stage video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.stage img{background:transparent}
.thumbs{display:flex;gap:8px;padding:10px;flex-wrap:wrap}
.thumbs button{width:62px;height:62px;border-radius:var(--r-sm);border:2px solid transparent;padding:0;overflow:hidden;background:var(--card);display:grid;place-items:center}
.thumbs button[aria-current="true"]{border-color:var(--rose)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{padding:26px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.info h2{font-size:1.8rem}
.info .desc{white-space:pre-line;color:var(--ink)}
.specs{display:flex;gap:8px;flex-wrap:wrap}
.spec{display:inline-flex;gap:6px;align-items:center;background:var(--paper-2);border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:700}
.spec span{color:var(--ink-soft);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:800;text-decoration:none;font-size:1rem}
.btn.primary{background:var(--rose-deep);color:var(--on-rose)}
.btn.soft{background:var(--paper-2);color:var(--ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:7px 13px;font-size:.88rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.help{font-size:.88rem;color:var(--ink-soft)}
.copybox{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:var(--r-md);padding:10px;background:var(--paper);resize:vertical}

/* list drawer */
.sheet{background:var(--card);width:min(460px,100%);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:14px;position:relative}
.li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center}
.li .mini{width:52px;height:52px;border-radius:var(--r-sm);overflow:hidden}
.li .mini img{width:100%;height:100%;object-fit:cover}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px}
.qty button{border:0;background:transparent;width:30px;height:30px;font-weight:800}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;border-top:1.5px dashed var(--line);padding-top:10px}

/* admin */
.admin-wrap{background:var(--paper);width:min(1040px,100%);border-radius:var(--r-lg);overflow:hidden;position:relative;border:1.5px solid var(--line)}
.admin-head{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--card);border-bottom:1.5px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:3}
.admin-head h2{font-size:1.35rem;flex:1;min-width:150px}
.dirty{font-size:.85rem;font-weight:800;color:var(--warn)}
.tabs{display:flex;gap:4px;padding:10px 20px 0;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:12px 12px 0 0;font-weight:800;color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--card);color:var(--rose-deep)}
.panel{background:var(--card);margin:0 20px 20px;border-radius:0 var(--r-md) var(--r-md) var(--r-md);padding:18px;display:flex;flex-direction:column;gap:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);text-align:left;padding:6px 8px;font-weight:800}
td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}
td.num input{width:86px;text-align:right;font-variant-numeric:tabular-nums}
.mini-th{width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--paper-2)}
.mini-th img{width:100%;height:100%;object-fit:cover}
.in{border:1.5px solid var(--line);background:var(--paper);border-radius:var(--r-sm);padding:8px 10px;width:100%;min-width:0}
.in:focus{border-color:var(--rose);outline:0}
textarea.in{min-height:96px;resize:vertical}
label.f .in{font-weight:500}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.9rem;min-width:0}
label.f small{font-weight:600;color:var(--ink-soft)}
.check{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.92rem}
.check input{width:18px;height:18px;accent-color:var(--rose-deep)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{aspect-ratio:1/1;max-width:100%;border:2px dashed var(--line);border-radius:var(--r-md);position:relative;overflow:hidden;display:grid;place-items:center;background:var(--paper);text-align:center;font-weight:800;font-size:.85rem;color:var(--ink-soft)}
.slot img,.slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot label{cursor:pointer;display:grid;place-items:center;gap:4px;width:100%;height:100%;padding:8px}
.slot input{position:absolute;width:1px;height:1px;opacity:0}
.slot .rm{position:absolute;top:6px;right:6px;z-index:2;border:0;border-radius:999px;background:var(--card);padding:3px 9px;font-size:.78rem;font-weight:800}
.slot.busy::after{content:attr(data-msg);position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 82%,transparent);color:var(--ink);font-weight:800}
.stepper{display:inline-flex;align-items:center;gap:2px}
.stepper button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-weight:800;line-height:1}
.stepper input{width:52px;text-align:center}
.promo-card{border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.promo-card .grow{flex:1;min-width:200px}
.state{font-size:.75rem;font-weight:800;border-radius:999px;padding:3px 9px}
.state.live{background:var(--mint);color:#173b33}
.state.off{background:var(--paper-2);color:var(--ink-soft)}
.state.soon{background:var(--butter);color:#4a3415}
.prodpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:6px;max-height:200px;overflow:auto;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px}
.meter{height:10px;border-radius:999px;background:var(--paper-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--rose)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:90;max-width:calc(100% - 32px);text-align:center}
.confirm{display:inline-flex;gap:6px;align-items:center}
.reels{margin-top:24px;display:grid;gap:12px}
.custom{margin-top:40px;border-radius:var(--r-lg);border:2px dashed var(--rose);background:var(--card);padding:24px clamp(18px,4vw,34px);display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px}
@media (max-width:760px){.custom{grid-template-columns:1fr}}
.custom h2{font-size:clamp(1.5rem,3.6vw,2rem)}
.custom .hand{font-family:var(--f-hand);font-size:1.45rem;color:var(--rose-deep)}
.custom .intro{display:grid;gap:10px;align-content:start}
.custom .intro p{margin:0;color:var(--ink-soft)}
.gal{margin-top:40px;display:grid;gap:12px}
.gal-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gal-head h2{font-size:1.5rem}
.gal-head .hand{font-family:var(--f-hand);font-size:1.3rem;color:var(--rose-deep)}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px}
.polaroid{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;text-align:left;transition:transform .2s ease}
.polaroid:nth-child(odd){transform:rotate(-1.2deg)} .polaroid:nth-child(even){transform:rotate(1deg)}
.polaroid:hover{transform:rotate(0) translateY(-3px)}
.polaroid .pic{aspect-ratio:1/1;width:100%;max-width:100%;border-radius:8px;overflow:hidden;background:var(--paper-2);display:block}
.polaroid .pic img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid .who{font-family:var(--f-hand);font-size:1.25rem;line-height:1.1;color:var(--ink)}
.polaroid .what{font-size:.82rem;color:var(--ink-soft)}
.gal-view{display:grid;gap:12px;padding:18px}
.gal-view img{width:100%;max-height:70vh;object-fit:contain;border-radius:var(--r-md);background:var(--paper-2)}
.refpick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.refpick img{width:72px;height:72px;object-fit:cover;border-radius:var(--r-sm);border:1.5px solid var(--line)}
.refpick input{position:absolute;width:1px;height:1px;opacity:0}
.card-img{width:100%;max-width:360px;border-radius:var(--r-md);border:1.5px solid var(--line);display:block}
.custom ol{margin:0;padding-left:20px;color:var(--ink-soft);display:grid;gap:4px}
.reels-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.reels-head h2{font-size:1.5rem}
.reels-head .hand{font-family:var(--f-hand);font-size:1.3rem;color:var(--rose-deep)}
.reel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:620px}
.reel{display:flex;flex-direction:column;gap:6px;min-width:0}
.reel video{width:100%;max-width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:var(--r-lg);background:#000;display:block;border:1.5px solid var(--line)}
.reel p{margin:0;font-size:.92rem;color:var(--ink-soft);overflow-wrap:anywhere}
.reel a{font-weight:800;font-size:.9rem;color:var(--rose-deep)}
.reel-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-md);padding:10px}
.reel-row video{width:64px;aspect-ratio:9/16;object-fit:cover;border-radius:8px;background:#000}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<body>
<template id="shell">
<div class="wrap">
  <header class="top">
    <div class="logo" role="img" aria-label="Big Ideas Little Maker logo"></div>
    <div class="brand">
      <h1 data-bind="name"></h1>

      <button class="pill" id="listBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9A5.3 5.3 0 0 1 12 6a5.3 5.3 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/></svg>My list <span class="count" id="listCount">0</span></button>
      <button class="pill admin" id="adminBtn" type="button" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span id="adminLabel">Admin</span></button>
    </div>
  </header>
  <section class="promos" id="promoBar" aria-label="Current deals"></section>
  <section class="hero">
    <h2 data-bind="heroTitle"></h2>
    <p data-bind="about"></p>
    <div class="note" data-bind="heroNote"></div>
  </section>
  <section class="reels" id="reels" aria-label="Latest from Instagram" hidden></section>
  <section class="filters" aria-label="Find a product">
    <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search dragons, keychains, gifts…" aria-label="Search products"></label>
    <div class="chips" id="chips"></div>
  </section>
  <main class="grid" id="grid" aria-live="polite"></main>
  <section class="gal" id="gallery" aria-label="Happy customers" hidden></section>
  <section class="custom" id="custom" aria-labelledby="customTitle">
    <div class="intro">
      <div class="hand">have a big idea?</div>
      <h2 id="customTitle" data-bind="customTitle"></h2>
      <p data-bind="customText"></p>
      <ol><li>Tell us what you'd like.</li><li>Copy your request and send it to us on Instagram.</li><li>We reply with a price and a time to print it.</li></ol>
    </div>
    <form class="form" id="customForm">
      <label class="f">What kind of thing?<select class="in" id="c-kind" name="kind"><option>Keychain</option><option>Animal or figure</option><option>Fidget toy</option><option>Desk or home item</option><option>Gift or party favor</option><option>Something else</option></select></label>

      <div class="f full"><span>Reference photo <small>(optional)</small></span><div class="refpick"><img id="c-thumb" alt="Your reference photo" hidden><label class="btn ghost sm" for="c-photo">Choose a photo</label><input id="c-photo" type="file" accept="image/*"><button class="btn ghost sm" type="button" id="c-nophoto" hidden>Remove</button></div><small>A drawing, a screenshot or a picture of something you like.</small></div>

        <div id="c-cardwrap" hidden style="display:grid;gap:8px"><b>Your request card</b><img class="card-img" id="c-card" alt="Your request card with your reference photo"><div class="actions"><button class="btn ghost sm" type="button" id="c-save" hidden>Save image</button></div><div class="help">Save this image (on a phone, press and hold it) and send it in the same DM with your message.</div></div>
        <div class="help">Paste the message in a DM to us. You can also attach any other photos there.</div>

  </section>
  <footer>

<script type="application/json" id="store">{"rev":1,"shop":{"name":"Big Ideas Little Maker","tagline":"little maker, big ideas","heroTitle":"3D printed treasures, designed by a 9-year-old maker","about":"Every piece is printed one thin layer at a time in my little workshop. Pick your favorites, add them to your list, and send me a message on Instagram to order.","heroNote":"thank you for supporting a young maker!","city":"Cleveland, Ohio","instagram":"bigideas_littlemaker","contactNote":"Orders are handled by a parent through Instagram messages.","categories":["Fidgets","Keychains","Animals","Desk & Home","Gifts"],"newDays":21},"products":[{"id":"p-dragon","name":"Flexi Crystal Dragon","category":"Fidgets","price":14,"stock":5,"madeToOrder":false,"description":"A wiggly dragon with moving joints. It bends, curls and sits on your shoulder. Printed in one piece, no glue!","colors":"Pink, Purple, Rainbow silk","size":"10 in long","printHours":"4","photos":[null,null,null],"video":null,"featured":true,"hidden":false,"example":true,"createdAt":"2026-10-10"},{"id":"p-name","name":"Custom Name Keychain","category":"Keychains","price":7,"stock":0,"madeToOrder":true,"description":"Your name (up to 10 letters) in two colors. Great for backpacks and lunch boxes.","colors":"Pick any 2 colors","size":"3 in","printHours":"1","photos":[null,null,null],"video":null,"featured":false,"hidden":false,"example":true,"createdAt":"2026-10-01"},{"id":"p-cat","name":"Sleepy Cat Planter","category":"Desk & Home","price":12,"stock":2,"madeToOrder":false,"description":"A tiny planter for succulents with a sleepy cat face. Has a drainage hole.","colors":"White, Blush, Mint","size":"3.5 in tall","printHours":"5","photos":[null,null,null],"video":null,"featured":false,"hidden":false,"example":true,"createdAt":"2026-09-20"},{"id":"p-axolotl","name":"Pocket Axolotl","category":"Animals","price":5,"stock":12,"madeToOrder":false,"description":"A smiley little axolotl that fits in your pocket. Collect <script id="app">
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n||0);
const uid=p=>p+"-"+Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const blob=id=>!id?"":id.includes("/")?id:"/_blob/"+id;
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ss={get(k){try{return JSON.parse(sessionStorage.getItem(k))}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};

let SAVED=JSON.parse($("#store").textContent);
let D=structuredClone(SAVED);           // working copy (admin edits here, shop renders from it)
let dirty=false, canAdmin=false, artifactApi=null, assetsApi=null;
let filter={q:"",cat:"All"};
let lang=ls.get("bi-lang")||"es";

/* ---------- pricing ---------- */
function promoLive(p){const t=today();return p.active&&(!p.start||p.start<=t)&&(!p.end||p.end>=t)}
function promoApplies(pr,p){return pr.scope==="all"||(pr.scope==="category"&&pr.category===p.category)||(pr.scope==="products"&&(pr.productIds||[]).includes(p.id))}
function priceOf(p){
  let best=null,sale=p.price;
  for(const pr of D.promos.filter(promoLive)){ if(!promoApplies(pr,p))continue;
    const v=pr.kind==="percent"?p.price*(1-pr.value/100):Math.max(0,p.price-pr.value);
    if(v<sale-0.004){sale=v;best=pr} }
  return {base:p.price,sale:Math.round(sale*100)/100,promo:best};
}
function stockInfo(p){
  if(p.stock>3)return{cls:"ok",txt:"In stock"};
  if(p.stock>0)return{cls:"low",txt:`Only ${p.stock} left!`};
  if(p.madeToOrder)return{cls:"mto",txt:"Made to order"};
  return{cls:"out",txt:"Sold out"};
}
function isNew(p){if(!p.createdAt)return false;return (Date.now()-new Date(p.createdAt+"T12:00:00").getTime())/864e5<=(+D.shop.newDays||21)}
const BULB=`<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/><path d="M12 7.5c-.6-.9-2-.6-2 .5 0 .9 2 2.2 2 2.2s2-1.3 2-2.2c0-1.1-1.4-1.4-2-.5z"/></svg>`;
const media=(id,alt)=>id?`<img src="${blob(id)}" alt="${esc(alt)}" loading="lazy" data-fb>`:`<div class="ph">${BULB}</div>`;
document.addEventListener("error",e=>{const el=e.target;if(el&&el.tagName==="IMG"&&el.hasAttribute("data-fb")){const d=document.createElement("div");d.className="ph";d.innerHTML=BULB;el.replaceWith(d)}},true);

/* ---------- shop render ---------- */
function bind(){
  const s=D.shop, ig=(s.instagram||"").replace(/^@/,"");
  const map={customTitle:s.customTitle||"Dream it, we print it",customText:s.customText||"Looking for something that isn't in the shop? Tell us your idea and we'll try to design and 3D print it just for you.",name:s.name,tagline:s.tagline,heroTitle:s.heroTitle,about:s.about,heroNote:s.heroNote,city:s.city,igHandle:"@"+ig,igHandle2:"@"+ig};
  for(const [k,v] of Object.entries(map)) $$(`[data-bind="${k}"]`).forEach(el=>el.textContent=v||"");
  $$('[data-bind="igLink"]').forEach(a=>a.href="https://www.instagram.com/"+encodeURIComponent(ig)+"/");
}
function renderPromos(){
  const live=D.promos.filter(promoLive);
  $("#promoBar").innerHTML=live.map(p=>`<div class="promo"><span class="tag">${p.kind==="percent"?esc(p.value)+"% off":fmt(p.value)+" off"}</span><span>${esc(p.banner||p.title)}</span>${p.end?`<small>until ${esc(new Date(p.end+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}))}</small>`:""}</div>`).join("");
}
function renderChips(){
  const cats=["All",...D.shop.categories.filter(c=>D.products.some(p=>!p.hidden&&p.category===c))];
  if(!cats.includes(filter.cat))filter.cat="All";
  $("#chips").innerHTML=cats.map(c=>`<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c===filter.cat}">${esc(c)}</button>`).join("");

function closeTop(){const s=scrimStack.pop();if(s)s.remove();if(!scrimStack.length)document.body.style.overflow=""}

/* ---------- request card (photo + request in one image) ---------- */
let refURL=null;
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function buildCard(lines){
  if(!refURL)return null;
  try{
    const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
    x.fillStyle="#fbf2ef";x.fillRect(0,0,W,H);
    for(let y=0;y<H;y+=16){x.fillStyle="rgba(201,138,142,.10)";x.fillRect(0,y,W,2)}
    const img=await loadImg(refURL);const ph=720,pw=W-96;
    const sc=Math.max(pw/img.width,ph/img.height),sw=pw/sc,sh=ph/sc;
    x.save();x.beginPath();x.roundRect?x.roundRect(48,150,pw,ph,36):x.rect(48,150,pw,ph);x.clip();
    x.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,48,150,pw,ph);x.restore();
    try{const m=getComputedStyle(document.documentElement).getPropertyValue("--logo").match(/url\(["']?(data:[^"')]+)/);if(m){const lg=await loadImg(m[1]);x.save();x.beginPath();x.arc(108,78,54,0,7);x.clip();x.drawImage(lg,54,24,108,108);x.restore()}}catch(e){}
    x.fillStyle="#a0555f";x.font="600 46px 'Young Serif',Georgia,serif";x.fillText(D.shop.name||"",184,92);
    x.fillStyle="#4f3238";x.font="700 34px Nunito,system-ui,sans-serif";x.fillText("Custom request",48,930);
    x.font="500 29px Nunito,system-ui,sans-serif";
    let y=982;const maxW=W-96;
    for(const ln of lines.slice(1,-1)){let words=ln.split(" "),cur="";
      for(const w of words){const test=cur?cur+" "+w:w;if(x.measureText(test).width>maxW&&cur){x.fillText(cur,48,y);y+=40;cur="  "+w}else cur=test}
      if(cur){x.fillText(cur,48,y);y+=40} if(y>H-40)break}
    return c.toDataURL("image/jpeg",.88);
  }catch(e){return null}
}

/* iPhone videos (.mov / HEVC / large) are re-encoded on the device: play → canvas → MediaRecorder (MP4 on Safari, WebM elsewhere) */
const MAXS=60;
function prepVideo(file,box,onBlob){
  const vb=$("#vidBox",box);vb.hidden=false;
  const url=URL.createObjectURL(file);
  const v=document.createElement("video");v.playsInline=true;v.preload="auto";v.src=url;v.setAttribute("playsinline","");
  v.style.cssText="width:100%;max-height:220px;border-radius:10px;background:#000";
  vb.innerHTML=`<div class="help">…</div>`;
  v.onerror=()=>{vb.innerHTML=`<div class="help">${t("vidCant")}</div>`};
  v.onloadedmetadata=()=>{
    const dur=Math.min(v.duration||0,MAXS);
    vb.innerHTML="";vb.appendChild(v);
    vb.insertAdjacentHTML("beforeend",`<div class="help">${t("vidPrep").replace("{s}",Math.ceil(dur))}${v.duration>MAXS?" "+t("vidLong"):""}</div><div class="meter"><i id="vidBar" style="width:0"></i></div><div class="actions"><button class="btn primary sm" type="button" id="vidGo">${t("vidGo")}</button><button class="btn ghost sm" type="button" id="vidX">${t("cancel")}</button></div>`);
    $("#vidX",vb).onclick=()=>{try{v.pause()}catch(e){}URL.revokeObjectURL(url);vb.hidden=true;vb.innerHTML=""};
    $("#vidGo",vb).onclick=()=>{
      const go=$("#vidGo",vb);go.disabled=true;go.textContent=t("vidConv");$("#vidX",vb).disabled=true;
      let lock=null;try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>lock=l).catch(()=>{})}catch(e){}
      transcode(v,dur,f=>{const b=$("#vidBar",vb);if(b)b.style.width=Math.min(100,f*100).toFixed(1)+"%"})   // synchronous until play(): keeps the tap's permission to play sound
        .then(async blob=>{if(blob.size>20*1048576)throw{code:"too_large"};go.textContent=t("uploading");await onBlob(blob);vb.hidden=true;vb.innerHTML=""})
        .catch(err=>{toast(t(err&&err.code==="no_recorder"?"vidNoRec":err&&err.code==="too_large"?"tooBig":err&&err.code?"upErr":"vidFail"));go.disabled=false;go.textContent=t("vidGo");$("#vidX",vb).disabled=false})
        .finally(()=>{try{lock&&lock.release()}catch(e){}URL.revokeObjectURL(url)});
    };
  };
}
function transcode(v,dur,onProg){
  const types=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  const mime=window.MediaRecorder&&types.find(x=>{try{return MediaRecorder.isTypeSupported(x)}catch(e){return false}});
  const c=document.createElement("canvas");
  if(!mime||!c.captureStream)return Promise.reject({code:"no_recorder"});
  const sc=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),ev=n=>Math.max(2,Math.round(n/2)*2);
  c.width=ev(v.videoWidth*sc);c.height=ev(v.videoHeight*sc);
  const ctx=c.getContext("2d"),stream=c.captureStream(30);
  let ac=null;
  try{const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();const src=ac.createMediaElementSource(v),dst=ac.createMediaStreamDestination();src.connect(dst);dst.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr))}catch(e){ac=null;v.muted=true}
  const vbps=Math.max(700000,Math.min(2500000,Math.floor(17*1048576*8/Math.max(dur,1))-128000));
  let rec;try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:vbps,audioBitsPerSecond:96000})}catch(e){return Promise.reject({code:"no_recorder"})}
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  let stopped=false;
  const result=new Promise((res,rej)=>{rec.onstop=()=>{try{ac&&ac.close()}catch(e){}stream.getTracks().forEach(tr=>tr.stop());
    const type=mime.split(";")[0];const b=new Blob(chunks,{type});b.size?res(b):rej({})};rec.onerror=()=>rej({})});
  const finish=()=>{if(stopped)return;stopped=true;try{v.pause()}catch(e){}if(rec.state!=="inactive")rec.stop()};
  const draw=()=>{if(stopped)return;ctx.drawImage(v,0,0,c.width,c.height);onProg(v.currentTime/dur);if(v.currentTime>=dur-0.05||v.ended)return finish();next()};
  const next=()=>v.requestVideoFrameCallback?v.requestVideoFrameCallback(draw):requestAnimationFrame(draw);
  v.onended=finish;v.currentTime=0;v.controls=false;
  try{ctx.drawImage(v,0,0,c.width,c.height)}catch(e){}
  rec.start(1000);
  const pp=v.play();
  next();
  return Promise.resolve(pp).then(()=>result,()=>{finish();return Promise.reject({})});
}
async function shrink(file){
  if(file.type==="image/gif"||file.type==="image/svg+xml")return file;
  try{const bmp=await createImageBitmap(file);const max=1600,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/webp",.86));if(b&&b.type==="image/webp")return b;
    const j=await new Promise(r=>c.toBlob(r,"image/jpeg",.86));return j||file}catch(e){return file}
}

function editReel(){
  const R={id:uid("rl"),url:"",caption:"",video:null,date:today()};
  const s=openScrim("","sheet");const box=s.firstElementChild;box.style.width="min(560px,100%)";
  box.innerHTML=`${X}<h2>${t("newReel")}</h2><form class="form" id="rf">
   <label class="f full">${t("reelUrl")}<input class="in" id="rf-url" name="url" inputmode="url" placeholder="https://www.instagram.com/reel/…"></label>
   <label class="f full">${t("caption")}<input class="in" id="rf-cap" name="caption" maxlength="140"></label>
   <div class="full" style="display:grid;gap:8px"><b>${t("reelFile")}</b><div class="slots" id="rslot"></div><div id="vidBox" hidden style="display:grid;gap:8px;border:1.5px dashed var(--line);border-radius:var(--r-md);padding:12px"></div></div>
   <div class="actions full"><button class="btn primary" type="submit">${t("save")}</button><button class="btn ghost" type="button" data-close>${t("cancel")}</button></div></form>`;
  const drawSlot=()=>{$("#rslot",box).innerHTML=slotHTML("vid",3,R.video)};drawSlot();
  box.addEventListener("click",e=>{if(e.target.closest("[data-close]"))return closeTop();if(e.target.closest("[data-rm]")){R.video=null;drawSlot()}});
  box.addEventListener("change",async e=>{const inp=e.target.closest("input[type=file]");if(!inp||!inp.files[0])return;const file=inp.files[0],slot=inp.closest(".slot");inp.value="";
    if(!assetsApi){toast(t("noAssets"));return}
    const up=async b=>{const r=await assetsApi.upload(b,{type:b.type});R.video=r.id;drawSlot()};
    if(/^video\/(mp4|webm)$/.test(file.type)&&file.size<=19.5*1048576){slot.classList.add("busy");slot.dataset.msg=t("uploading");try{await up(file)}catch(err){toast(t("upErr"));drawSlot()}}
    else if(file.type.startsWith("video/")||/\.(mov|mp4|m4v|webm)$/i.test(file.name))prepVideo(file,box,up);
    else toast(t("badType"));});
  $("#rf",box).addEventListener("submit",e=>{e.preventDefault();const f=e.target.elements;
    const raw=f.url.value.trim(),url=safeIg(raw);if(raw&&!url){toast(t("badUrl"));return}
    if(!R.video){toast(t("needVid"));return}
    R.url=url;R.caption=f.caption.value.trim();D.reels=[R,...(D.reels||[])];closeTop();markDirty();drawPanel();});
}

/* ---------- customer gallery editor ---------- */
function editGal(){
  const G={id:uid("g"),photo:null,name:"",caption:"",productId:"",date:today()};
  const s=openScrim("","sheet");const box=s.firstElementChild;box.style.width="min(560px,100%)";
  box.innerHTML=`${X}<h2>${t("newGal")}</h2><form class="form" id="gf">
   <div class="full" style="display:grid;gap:8px"><div class="slots" id="gslot" style="grid-template-columns:minmax(0,180px)"></div></div>
   <label class="f">${t("gName")}<input class="in" id="gf-name" name="name" maxlength="30"></label>
   <label class="f">${t("gProd")}<select class="in" id="gf-prod" name="productId"><option value="">${t("gNone")}</option>${D.products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></label>
   <label class="f full">${t("gCap")}<input class="in" id="gf-cap" name="caption" maxlength="120"></label>
   <label class="check full"><input type="checkbox" id="gf-ok" name="ok">${t("gConsent")}</label>
   <div class="help full">${t("galHelp")}</div>
   <div class="actions full"><button class="btn primary" type="submit">${t("save")}</button><button class="btn ghost" type="button" data-close>${t("cancel")}</button></div></form>`;
  const drawSlot=()=>{$("#gslot",box).innerHTML=slotHTML("img",0,G.photo)};drawSlot();
  box.addEventListener("click",e=>{if(e.target.closest("[data-close]"))return closeTop();if(e.target.closest("[data-rm]")){G.photo=null;drawSlot()}});
  box.addEventListener("change",async e=>{const inp=e.target.closest("input[type=file]");if(!inp||!inp.files[0])return;const file=inp.files[0],slot=inp.closest(".slot");
    if(!assetsApi){toast(t("noAssets"));return}if(!file.type.startsWith("image/")){toast(t("badType"));return}
    slot.classList.add("busy");slot.dataset.msg=t("uploading");
    try{const r=await assetsApi.upload(await shrink(file));G.photo=r.id}catch(err){toast(t("upErr"))}drawSlot();});
  $("#gf",box).addEventListener("submit",e=>{e.preventDefault();const f=e.target.elements;
    if(!G.photo){toast(t("needPhoto"));return}if(!f.ok.checked){toast(t("needConsent"));return}
    Object.assign(G,{name:f.name.value.trim(),caption:f.caption.value.trim(),productId:f.productId.value});
    D.gallery=[G,...(D.gallery||[])];closeTop();markDirty();drawPanel();});
}

/* ---------- promo editor ---------- */
function editPromo(id){
  const orig=id?D.promos.find(x=>x.id===id):null;
  const p=orig?structuredClone(orig):{id:uid("pr"),title:"",banner:"",kind:"percent",value:10,scope:"all",category:D.shop.categories[0]||"",productIds:[],start:today(),end:"",active:true,example:false};
  const s=openScrim("","sheet");const box=s.firstElementChild;box.style.width="min(680px,100%)";
  box.innerHTML=`${X}<h2>${orig?esc(orig.title):t("newPromo")}</h2><form class="form" id="prf">
   <label class="f">${t("ptitle")}<input class="in" id="prf-title" name="title" value="${esc(p.title)}" placeholder="Halloween"></label>
   <label class="f">${t("banner")}<input class="in" id="prf-banner" name="banner" value="${esc(p.banner)}" placeholder="Spooky week: 15% off!"></label>
   <label class="f">${t("kind")}<select class="in" id="prf-kind" name="kind"><option value="percent" ${p.kind==="percent"?"selected":""}>${t("pct")}</option><option value="amount" ${p.kind==="amount"?"selected":""}>${t("amt")}</option></select></label>
   <label class="f">${t("value")}<input class="in" id="prf-value" name="value" type="number" min="0" step="0.5" value="${p.value}"></label>
   <label class="f">${t("start")}<input class="in" id="prf-start" name="start" type="date" value="${esc(p.start)}"></label>
   <label class="f">${t("end")}<input class="in" id="prf-end" name="end" type="date" value="${esc(p.end)}"></label>
   <label class="f">${t("scope")}<select class="in" id="prf-scope" name="scope"><option value="all" ${p.scope==="all"?"selected":""}>${t("sAll")}</option><option value="category" ${p.scope==="category"?"selected":""}>${t("sCat")}</option><option value="products" ${p.scope==="products"?"selected":""}>${t("sProd")}</option></select></label>
   <label class="f" id="catWrap">${t("cat")}<select class="in" id="prf-cat" name="category">${D.shop.categories.map(c=>`<option ${c===p.category?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
   <div class="full" id="prodWrap"><div class="prodpick">${D.products.map(x=>`<label class="check"><input type="checkbox" name="pid" value="${esc(x.id)}" ${(p.productIds||[]).includes(x.id)?"checked":""}>${esc(x.name)}</label>`).join("")}</div></div>
   <label class="check full"><input type="checkbox" id="prf-active" name="active" ${p.active?"checked":""}>${t("active")}</label>
   <div class="actions full"><button class="btn primary" type="submit">${t("save")}</button><button class="btn ghost" type="button" data-close>${t("cancel")}</button></div></form>`;
  const form=$("#prf",box),f=form.elements;
  const sync=()=>{$("#catWrap",box).hidden=f.scope.value!=="category";$("#prodWrap",box).hidden=f.scope.value!=="products"};sync();
  f.scope.addEventListener("change",sync);
  box.addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeTop()});
  form.addEventListener("submit",e=>{e.preventDefault();
    Object.assign(p,{title:f.title.value.trim()||f.banner.value.trim()||"Deal",banner:f.banner.value.trim(),kind:f.kind.value,value:Math.max(0,+f.value.value||0),start:f.start.value,end:f.end.value,scope:f.scope.value,category:f.category.value,productIds:$$('input[name="pid"]:checked',form).map(x=>x.value),active:f.active.checked});
    if(p.kind==="percent")p.value=Math.min(100,p.value);
    if(orig){if(JSON.stringify(orig)!==JSON.stringify(p))p.example=false;Object.assign(orig,p)}else D.promos.unshift(p);
    closeTop();markDirty();drawPanel();});
}

/* ---------- publish (the page is the record) ---------- */
const RESET=":root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}";
function buildDoc(data){
  const SC="<"+"/script>";
  const keep=$$("[data-keep]").map(n=>n.outerHTML).join("");
  const json=JSON.stringify(data).replace(/</g,"\\u003c");
  const body=keep+`<style id="theme">${$("#theme").textContent}</style><template id="shell">${$("#shell").innerHTML}</template><div id="root"></div><script type="application/json" id="store">${json}${SC}<script id="app">${$("#app").textContent}${SC}`;
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${RESET}</style></head><body>${body}</body></html>`;
}
/* ---------- GitHub backend: data.json + media/ in the repo ---------- */
const GH={cfg:ls.get("bi-gh"),
  guess(){const h=location.hostname,m=h.match(/^([^.]+)\.github\.io$/i);const seg=location.pathname.split("/").filter(Boolean)[0];
    return {owner:m?m[1]:"",repo:m?(seg&&!/\.html?$/.test(seg)?seg:h):"",branch:"main"}},
  async api(path,opt={}){const c=GH.cfg;const res=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}${path}`,{...opt,headers:{"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github+json",...(opt.headers||{})}});
    if(!res.ok){const e=new Error("GitHub "+res.status);e.status=res.status;throw e}return res.status===204?null:res.json()},
  async sha(path){try{return (await GH.api(`/contents/${path}?ref=${encodeURIComponent(GH.cfg.branch)}`)).sha}catch(e){if(e.status===404)return null;throw e}},
  b64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(blob)})},
  async put(path,blob,msg){const sha=await GH.sha(path);return GH.api(`/contents/${path}`,{method:"PUT",body:JSON.stringify({message:msg,content:await GH.b64(blob),branch:GH.cfg.branch,...(sha?{sha}:{})})})}
};
const EXT={"image/webp":"webp","image/jpeg":"jpg","image/png":"png","image/gif":"gif","video/mp4":"mp4","video/webm":"webm"};
const ghAssets={
  async upload(b,o={}){const type=(o.type||b.type||"").split(";")[0];const ext=EXT[type];if(!ext)throw{code:"unsupported_type"};
    if(b.size>40*1048576)throw{code:"too_large"};const path=`media/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}.${ext}`;
    try{await GH.put(path,b,"Add "+path)}catch(e){throw{code:"upstream_error"}}return {id:path,url:path}},
  async list(){let items=[];try{items=await GH.api(`/contents/media?ref=${encodeURIComponent(GH.cfg.branch)}`)}catch(e){if(e.status!==404)throw e}
    items=(items||[]).filter(x=>x.type==="file"&&x.name!==".gitkeep");const bytes=items.reduce((a,x)=>a+x.size,0);
    return {assets:items.map(x=>({id:x.path,sha:x.sha,sizeBytes:x.size})),usage:{files:items.length,bytes,maxFiles:1000,maxBytes:1024*1048576}}},
  async delete(id){const r=await ghAssets.list();const a=r.assets.find(x=>x.id===id);if(!a)return{deleted:false};
    await GH.api(`/contents/${id}`,{method:"DELETE",body:JSON.stringify({message:"Remove "+id,sha:a.sha,branch:GH.cfg.branch})});return{deleted:true}}
};
async function publish(){
  if(!canAdmin){toast(t("noPub"));return}
  const btn=$("#pubBtn");if(btn){btn.disabled=true;btn.textContent=t("publishing")}
  const next=structuredClone(D);next.rev=(SAVED.rev||0)+1;next.updatedAt=new Date().toISOString();
  try{await GH.put("data.json",new Blob([JSON.stringify(next,null,1)],{type:"application/json"}),"Update shop");
    SAVED=next;D=structuredClone(next);dirty=false;ls.del("bi-draft");drawAdmin();renderShop();toast(t("ghPub"));}
  catch(err){toast(t("upErr")+" ("+(err.status||"")+")");if(btn){btn.disabled=false;btn.textContent=t("publish")}}
}
function signIn(){
  const g={...GH.guess(),...(GH.cfg||{})};
  const s=openScrim("","sheet");const box=s.firstElementChild;
  box.innerHTML=`${X}<h2>${t("ghTitle")}</h2><p class="help">${t("ghHelp")}</p><form class="form" id="ghf">
   <label class="f">${t("ghOwner")}<input class="in" id="gh-owner" name="owner" value="${esc(g.owner)}" required autocapitalize="off"></label>
   <label class="f">${t("ghRepo")}<input class="in" id="gh-repo" name="repo" value="${esc(g.repo)}" required autocapitalize="off"></label>
   <label class="f">${t("ghBranch")}<input class="in" id="gh-branch" name="branch" value="${esc(g.branch||"main")}" required autocapitalize="off"></label>
   <label class="f full">${t("ghToken")}<input class="in" id="gh-token" name="token" type="password" autocomplete="off" required></label>
   <div class="actions full"><button class="btn primary" type="submit">${t("ghGo")}</button><button class="btn ghost" type="button" data-lang>${t("lang")}</button></div></form>`;
  box.addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeTop();if(e.target.closest("[data-lang]")){lang=lang==="es"?"en":"es";ls.set("bi-lang",lang);closeTop();signIn()}});
  $("#ghf",box).addEventListener("submit",async e=>{e.preventDefault();const f=e.target.elements;
    GH.cfg={owner:f.owner.value.trim(),repo:f.repo.value.trim(),branch:f.branch.value.trim()||"main",token:f.token.value.trim()};
    try{const info=await GH.api("");if(!info.permissions||!info.permissions.push)throw 0;ls.set("bi-gh",GH.cfg);closeTop();await enterAdmin(true)}
    catch(err){GH.cfg=null;toast(t("ghBad"))}});
}
async function loadData(){
  try{let data;
    if(canAdmin){const r=await GH.api(`/contents/data.json?ref=${encodeURIComponent(GH.cfg.branch)}`,{headers:{"Accept":"application/vnd.github.raw+json"}});data=r}
    else{const res=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!res.ok)return;data=await res.json()}
    if(data&&data.products){SAVED=data;D=structuredClone(data);renderShop()}}catch(e){}
}
async function enterAdmin(open){
  canAdmin=true;assetsApi=ghAssets;$("#adminBtn").hidden=false;
  await loadData();
  const stash=ls.get("bi-draft");
  if(stash&&stash.base===SAVED.rev&&JSON.stringify(stash.data)!==JSON.stringify(SAVED)){D=stash.data;dirty=true;renderShop();toast(t("restored"))}
  if(open)openAdmin();
}
async function initCaps(){
  $("#adminLink").addEventListener("click",e=>{e.preventDefault();canAdmin?openAdmin():signIn()});
  if(GH.cfg&&GH.cfg.token){try{await GH.api("");await enterAdmin(location.hash==="#admin");return}catch(e){if(e.status===401)ls.del("bi-gh")}}
  await loadData();
  if(location.hash==="#admin")signIn();
}
/* ---------- boot ---------- */
function boot(){
  $("#root").appendChild($("#shell").content.cloneNode(true));
  renderShop();
  $("#grid").addEventListener("click",e=>{const c=e.target.closest("[data-open]");if(c)openProduct(c.dataset.open)});
  $("#chips").addEventListener("click",e=>{const c=e.target.closest("[data-cat]");if(c){filter.cat=c.dataset.cat;renderChips();renderGrid()}});
  $("#q").addEventListener("input",e=>{filter.q=e.target.value;renderGrid()});
  $("#listBtn").addEventListener("click",openList);
  $("#gallery").addEventListener("click",e=>{const c=e.target.closest("[data-gal]");if(c)openGallery(c.dataset.gal)});
  $("#customForm").addEventListener("submit",e=>{e.preventDefault();const f=e.target.elements;
    if(!f.idea.value.trim()){f.idea.focus();return}
    const d=f.date.value?new Date(f.date.value+"T12:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}):"";
    const lines=[`Hi ${D.shop.name}! I have a custom idea:`,`• Type: ${f.kind.value}`,`• Idea: ${f.idea.value.trim()}`,`• Quantity: ${Math.max(1,+f.qty.value||1)}`];
    if(f.colors.value.trim())lines.push(`• Colors: ${f.colors.value.trim()}`);
    if(f.size.value.trim())lines.push(`• Size: ${f.size.value.trim()}`);
    if(f.budget.value.trim())lines.push(`• Budget: ${f.budget.value.trim()}`);
    if(d)lines.push(`• Needed by: ${d}`);
    if(f.name.value.trim())lines.push(`• From: ${f.name.value.trim()}`);
    lines.push("Thank you!");
    $("#c-msg").value=lines.join("\n");
    $("#c-dm").href="https://ig.me/m/"+encodeURIComponent((D.shop.instagram||"").replace(/^@/,""));
    $("#customOut").hidden=false;
    buildCard(lines).then(url=>{const w=$("#c-cardwrap");if(!url){w.hidden=true;return}$("#c-card").src=url;w.hidden=false});
    $("#c-msg").scrollIntoView({behavior:"smooth",block:"center"});});
  $("#c-photo").addEventListener("change",e=>{const f=e.target.files[0];if(!f||!f.type.startsWith("image/"))return;if(refURL)URL.revokeObjectURL(refURL);refURL=URL.createObjectURL(f);const th=$("#c-thumb");th.src=refURL;th.hidden=false;$("#c-nophoto").hidden=false;e.target.value=""});
  $("#c-nophoto").addEventListener("click",()=>{if(refURL)URL.revokeObjectURL(refURL);refURL=null;$("#c-thumb").hidden=true;$("#c-nophoto").hidden=true;$("#c-cardwrap").hidden=true});
  $("#c-save").hidden=false;$("#c-save").addEventListener("click",()=>{const a=document.createElement("a");a.href=$("#c-card").src;a.download="big-ideas-request.jpg";document.body.appendChild(a);a.click();a.remove()});
  $("#c-copy").addEventListener("click",async()=>{const ta=$("#c-msg");try{await navigator.clipboard.writeText(ta.value);toast("Request copied")}catch(err){ta.focus();ta.select();toast("Selected — press copy")}});
  $("#adminBtn").addEventListener("click",openAdmin);
  $("#adminLabel").textContent=t("admin");
  initCaps();
}
boot();
})();
